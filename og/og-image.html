<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>marra OG image (1200x630)</title>
  <!-- Source for public/og-image.png. Regenerate with: npm run og -->
  <link href="https://api.fontshare.com/v2/css?f[]=satoshi@400,500,600&display=block" rel="stylesheet" />
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body { width: 1200px; height: 630px; overflow: hidden; }
    body {
      font-family: 'Satoshi', -apple-system, sans-serif; -webkit-font-smoothing: antialiased;
      background: #FAF9F7; color: #0F0E0D;
      padding: 72px 80px; display: flex; flex-direction: column; justify-content: space-between;
    }
    .wordmark { font-size: 40px; font-weight: 600; letter-spacing: -0.04em; }
    .wordmark span { color: #FF5C47; }
    h1 { font-size: 92px; font-weight: 600; line-height: 1.02; letter-spacing: -0.04em; max-width: 1000px; }
    h1 em { font-style: normal; color: #E8432E; }
    .foot {
      border-top: 1px solid rgba(0,0,0,.07); padding-top: 28px;
      font-size: 30px; font-weight: 500; color: #6B6760; letter-spacing: -0.01em;
    }
  </style>
</head>
<body>
  <p class="wordmark">marra<span>.</span></p>
  <h1>Referrals for your Shopify store, done <em>quietly.</em></h1>
  <p class="foot">Give £5, get £5.</p>
</body>
</html>
